name: Share relay

# The Cloudflare Worker that lets a browser join a shared tab (relay/). Pull
# requests run its checks; a push to main also deploys it, which briefly
# reconnects anyone in a shared tab. Deploying needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

# One deploy at a time, and never one cut off halfway.
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
