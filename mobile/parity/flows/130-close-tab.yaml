appId: cx.lpm.mobile
name: 130-close-tab
tags: [demo, projects, terminal]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Terminal 1"
    timeout: 5000
# Close takes effect at once and offers Undo for a few seconds.
- longPressOn: "Terminal 1"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "^Close$"
- extendedWaitUntil:
    visible: "Terminal 1 closed"
    timeout: 3000
- tapOn: "Undo"
- extendedWaitUntil:
    visible: "Terminal 1"
    timeout: 5000
- assertNotVisible: "Terminal 1 closed"
# Left alone, the close goes through.
- longPressOn: "Terminal 1"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "^Close$"
- extendedWaitUntil:
    visible: "Terminal 1 closed"
    timeout: 3000
- takeScreenshot: 1-undo-close
- extendedWaitUntil:
    notVisible: "Terminal 1 closed"
    timeout: 10000
- assertNotVisible: "Terminal 1"
- assertVisible: "New tab"
