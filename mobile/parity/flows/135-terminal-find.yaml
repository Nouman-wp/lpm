# Find in a terminal's scrollback, from the composer's + menu: every match
# marked, and which one is current out of how many.
appId: cx.lpm.mobile
name: 135-terminal-find
tags: [demo, terminal]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Terminal 1"
    timeout: 5000
- tapOn: "Terminal 1"
- extendedWaitUntil:
    visible: "Message"
    timeout: 10000
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Find in Terminal"
    timeout: 5000
- tapOn: "Find in Terminal"
- extendedWaitUntil:
    visible: "Find in terminal"
    timeout: 5000
- inputText: "dev/storefront"
- extendedWaitUntil:
    visible: "[0-9]+ of [0-9]+"
    timeout: 5000
- tapOn: "Next match"
- assertVisible: "[0-9]+ of [0-9]+"
- inputText: "zzq"
- extendedWaitUntil:
    visible: "No matches"
    timeout: 5000
- eraseText: 3
- extendedWaitUntil:
    visible: "[0-9]+ of [0-9]+"
    timeout: 5000
- takeScreenshot: 1-find
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Find in terminal"
    timeout: 5000
