# Files from the project's "…" menu: the project's folders as the desktop's
# Files tab lists them, changed files marked, a file opening in the preview.
appId: cx.lpm.mobile
name: 142-files-browse
tags: [demo, files]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Files"
      - extendedWaitUntil:
          visible: "components.*"
          timeout: 10000
- assertVisible: "package.json"
- assertVisible: "node_modules"
- assertVisible: "Go to File"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 1-files
# A folder pushes its own listing, titled with its name.
- tapOn: "components.*"
- extendedWaitUntil:
    visible: "CheckoutForm.tsx.*"
    timeout: 10000
- assertVisible: "Header.tsx"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 2-folder
- tapOn: "CheckoutForm.tsx.*"
- extendedWaitUntil:
    visible: ".*use client.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 3-preview
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Header.tsx"
    timeout: 5000
