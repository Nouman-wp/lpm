appId: cx.lpm.mobile
name: 50-git-review
tags: [demo, git]
---
- runFlow: subflows/enter-demo.yaml
- tapOn: "storefront"
- extendedWaitUntil:
    visible: "Tabs"
    timeout: 5000
- tapOn: "More"
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Review Changes.*"
      - extendedWaitUntil:
          visible: "components/CheckoutForm.tsx"
          timeout: 10000
# The diffs arrive in one batch right after the file list.
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Changes"
# The summary on top: how many files changed and how many are viewed.
- assertVisible: "4 files changed.*"
- assertVisible: ".*0 of 4 viewed"
- takeScreenshot: 1-review
# The jump menu: icon-only, labelled "Jump to file" on both platforms; its rows
# are the files' names over their folders.
- tapOn: "Jump to file"
- extendedWaitUntil:
    visible: "payments.ts.*"
    timeout: 5000
- assertVisible: "CheckoutForm.tsx.*"
- assertVisible: "page.tsx.*"
- takeScreenshot: 2-jump-menu
- tapOn: "payments.ts.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "lib/payments.ts"
- takeScreenshot: 3-jumped
# The pinned commit button opens the commit sheet, which drafts the message from
# the diff right away when there's none yet.
- tapOn: "Commit 4 files"
- extendedWaitUntil:
    visible: "feat\\(checkout\\): redesign the checkout form and add a payments module"
    timeout: 10000
- assertVisible: "Drafted from the diff"
- assertVisible: "Regenerate"
# One row for the files going in, one for where they push. Their values sit
# beside the labels, which is all both platforms name the same way.
- assertVisible: "Files.*"
- assertVisible: "Branch.*"
- assertVisible: "Commit and Push"
- assertVisible: "Commit only"
- takeScreenshot: 4-commit
# The Files row opens the list of files to include or leave out.
- tapOn: "Files.*"
- extendedWaitUntil:
    visible: "Deselect All"
    timeout: 5000
- assertVisible: "Only the selected files are committed."
- takeScreenshot: 5-files
