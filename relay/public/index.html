<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Shared tab · lpm</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="live.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <section id="panel" class="panel">
        <div class="top">
          <p id="brand" class="brand-row"><span class="brand">lpm</span><span>Shared tab</span></p>
          <div id="steps" class="steps" hidden><span></span><span></span><span></span></div>
        </div>
        <div class="body">
          <div id="greet" class="greet" hidden>
            <span id="greet-avatar" class="avatar large" aria-hidden="true"></span>
            <p id="greet-from" class="greet-from"></p>
            <h1 id="greet-label"></h1>
            <p id="greet-project" class="greet-project"></p>
          </div>
          <div id="heading" class="heading">
            <h1 id="panel-title">Loading…</h1>
            <p id="panel-text" class="lead" hidden></p>
          </div>
          <div id="check" class="check" hidden>
            <div id="check-code" class="tiles" role="img"></div>
            <p class="check-text">If they ask which ones you see, read these out.</p>
          </div>
          <form id="join-form" class="join" hidden>
            <label for="name">Your name, so they know it's you</label>
            <input id="name" maxlength="64" autocomplete="name" required />
            <button class="big" type="submit">Ask to join</button>
          </form>
          <button id="again" class="big" type="button" hidden>Ask to join again</button>
        </div>
        <button id="cancel" class="big secondary" type="button" hidden>Cancel</button>
        <p id="fine" class="fine" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="18" height="11" x="3" y="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <span>Encrypted between this page and their computer. <span class="keep">Nothing to install.</span></span>
        </p>
      </section>

      <section id="live" class="live" hidden>
        <header class="live-bar">
          <span id="live-avatar" class="avatar" aria-hidden="true"></span>
          <div class="who">
            <p class="who-label"><span id="live-label"></span> <span id="live-project" class="project"></span></p>
            <p id="status" class="status"><span id="status-text"></span></p>
          </div>
          <p id="others" class="others" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span id="others-text"></span>
          </p>
          <span id="access" class="access">View only</span>
          <button id="leave" class="leave" type="button">Leave</button>
        </header>
        <div class="frame"><div id="term"></div></div>
        <div class="dock">
          <p id="notice" class="notice" hidden></p>
          <form id="composer" class="composer">
            <div id="keys" class="keys">
              <button type="button" data-key="esc" title="Escape">Esc</button>
              <button type="button" data-key="up" aria-label="Up" title="Up">
                <svg viewBox="0 0 24 24"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
              </button>
              <button type="button" data-key="down" aria-label="Down" title="Down">
                <svg viewBox="0 0 24 24"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg>
              </button>
              <button type="button" data-key="tab" title="Tab">Tab</button>
              <button type="button" data-key="enter" aria-label="Return" title="Return">
                <svg viewBox="0 0 24 24"><path d="m9 10-5 5 5 5" /><path d="M20 4v7a4 4 0 0 1-4 4H4" /></svg>
              </button>
              <button type="button" data-key="interrupt" title="Interrupt">Ctrl C</button>
            </div>
            <div class="entry">
              <div id="box" class="box">
                <textarea id="prompt" rows="1" spellcheck="false" autocomplete="off" enterkeyhint="send"></textarea>
                <button id="send" class="send" type="submit" aria-label="Send" title="Send · Enter" disabled>
                  <svg viewBox="0 0 24 24"><path d="M22 2 11 13" /><path d="m22 2-7 20-4-9-9-4z" /></svg>
                </button>
              </div>
              <div id="locked" class="locked" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect width="18" height="11" x="3" y="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span class="locked-text">Watching only</span>
                <button class="ask" type="button" hidden>Ask to type</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
